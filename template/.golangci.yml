version: "2"
run:
  modules-download-mode: readonly
  tests: false
linters:
  enable:
    - dupl
    - goconst
    - gocyclo
    - lll
    - staticcheck
    - unparam
  disable:
    - depguard
  settings:
    dupl:
      threshold: 200
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 80
    govet:
      enable-all: true
    lll:
      line-length: 200
      tab-width: 4
    staticcheck:
      checks:
        - all
    whitespace:
      multi-if: true
      multi-func: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(shared)
      no-inline-comments: true
      custom-order: true
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
